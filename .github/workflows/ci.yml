name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Microclimate.Ci.slnf
      - name: Build
        run: dotnet build Microclimate.Ci.slnf -c Release --no-restore
      - name: Test with coverage
        run: >-
          dotnet test Microclimate.Ci.slnf -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger trx
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub;HtmlInline
      - name: Publish coverage summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coveragereport
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  maui-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build MAUI (Windows)
        run: >-
          dotnet build src/Microclimate.Client.Maui -c Release
          -f net10.0-windows10.0.19041.0
          -p:MauiTargetFramework=net10.0-windows10.0.19041.0
