# Перевірки PR до main та інтегрованих змін: сервер/Core на Linux, MAUI на Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow лише читає репозиторій; публікація застосунку тут не виконується.
permissions:
  contents: read

# Новий commit тієї самої гілки скасовує застарілий запуск.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI filter виключає платформний MAUI-проєкт; його перевіряє окремий job.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Перевіряє синтаксис Compose з тимчасовим значенням; контейнери не запускає.
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-configuration-validation-only
        run: docker compose -f deploy/docker-compose.yml --profile app config --quiet
      - name: Restore
        run: dotnet restore Microclimate.Ci.slnf
      - name: Build
        run: dotnet build Microclimate.Ci.slnf -c Release --no-restore
      - name: Test with coverage
        run: >-
          dotnet test Microclimate.Ci.slnf -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger trx
      # HTML і Markdown будуються зі справжніх Cobertura-звітів кожного тестового проєкту.
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub;HtmlInline
      - name: Publish coverage summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coveragereport
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  # Перевіряє Windows target; успіх не є доказом запуску UI на інших ОС.
  maui-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build MAUI (Windows)
        run: >-
          dotnet build src/Microclimate.Client.Maui -c Release
          -f net10.0-windows10.0.19041.0
          -p:MauiTargetFramework=net10.0-windows10.0.19041.0

  # Обов'язкова мобільна платформа має окрему перевірку XAML/C# та Android packaging.
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.404
      - name: Build MAUI (Android)
        run: >-
          dotnet build src/Microclimate.Client.Maui -c Release
          -f net10.0-android -p:MauiTargetFramework=net10.0-android
          -p:AndroidSdkDirectory=$ANDROID_HOME -p:JavaSdkDirectory=$JAVA_HOME

  # Справжні контейнер, PostgreSQL, міграції та HTTP-сценарій замість лише compose config.
  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-disposable-database-only
      COMPOSE_PROJECT_NAME: microclimate-ci
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL and API
        run: docker compose -f deploy/docker-compose.yml --profile app up -d --build api
      - name: Verify end-to-end HTTP workflow
        run: python3 deploy/smoke.py http://127.0.0.1:5195
      - name: Capture container logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --profile app logs --no-color > compose-smoke.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgres-smoke-log
          path: compose-smoke.log
      - name: Stop isolated CI stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml --profile app down -v
