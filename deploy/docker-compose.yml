# Без профілю запускається лише PostgreSQL; --profile app додає API та симулятор датчиків.
# Значення з deploy/.env залишаються локальними й не комітяться.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: microclimate
      POSTGRES_USER: microclimate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    # Порт БД доступний тільки з цього комп’ютера.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microclimate -d microclimate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development потрібен для локального демонстраційного запуску; це не production-конфігурація.
  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: Postgres
      Database__ConnectionString: "Host=db;Database=microclimate;Username=microclimate;Password=${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${API_PORT:-5195}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Симулятор надсилає виміри в API від імені датчика; id і ключ датчика задаються в deploy/.env.
  simulator:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/simulator.Dockerfile
    environment:
      Simulator__ApiBaseUrl: "http://api:8080/"
      Simulator__Sensors__0__SensorId: ${SIMULATOR_SENSOR_ID:-}
      Simulator__Sensors__0__DeviceKey: ${SIMULATOR_DEVICE_KEY:-}
      Simulator__Sensors__0__Scenario: ${SIMULATOR_SCENARIO:-Normal}
    depends_on:
      api:
        condition: service_started

# Іменований том зберігає дані БД між звичайними перезапусками контейнера.
volumes:
  postgres-data:
